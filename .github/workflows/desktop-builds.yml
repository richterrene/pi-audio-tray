name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools libegl1 libopengl0
      - run: python -m venv .venv && .venv/bin/python -m pip install --upgrade pip==26.2.0 && .venv/bin/python -m pip install -r requirements.txt
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python build_appimage.py
      - run: QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PiAudioTray-Linux-x86_64
          path: dist/*
          retention-days: 14
  macos:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies with isolated OpenSSL for source builds
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip==26.2.0
          OPENSSL_DIR="$(brew --prefix openssl@3)" OPENSSL_STATIC=1 .venv/bin/python -m pip install --no-cache-dir -r requirements.txt
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python build_macos.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PiAudioTray-macOS-${{ matrix.arch }}
          path: dist/*
          retention-days: 14
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip==26.2.0
          .venv/Scripts/python -m pip install -r requirements.txt
      - run: .venv/Scripts/python -m unittest discover -s tests -v
      - run: .venv/Scripts/python build_windows.py
      - name: Audit exact Windows build dependencies
        run: |
          .venv/Scripts/python tools/dependency_inventory.py | Out-File -Encoding utf8NoBOM dist/dependencies-Windows-x86_64.txt
          python -m venv .audit
          .audit/Scripts/python -m pip install --upgrade pip==26.2.0
          .audit/Scripts/python -m pip install pip-audit==2.10.1
          .audit/Scripts/pip-audit --no-deps --disable-pip -r dist/dependencies-Windows-x86_64.txt -f json -o dist/dependency-audit-Windows-x86_64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PiAudioTray-Windows-x86_64
          path: dist/*
          retention-days: 14
