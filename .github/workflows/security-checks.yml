name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 python3-dbus python3-gi dbus apache2-utils
      - run: python -m venv .venv && .venv/bin/python -m pip install --upgrade pip==26.2.0 && .venv/bin/python -m pip install -r requirements.txt
      - run: python -m venv .audit && .audit/bin/python -m pip install --upgrade pip==26.2.0 && .audit/bin/python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: /usr/bin/dbus-run-session -- /usr/bin/python3 -I tools/check_dbus_agent.py
      - name: Record exact dependencies and scan known advisories
        run: |
          mkdir -p security-results
          .venv/bin/python tools/dependency_inventory.py > security-results/dependencies.txt
          .audit/bin/pip-audit --disable-pip --no-deps -r security-results/dependencies.txt -f json -o security-results/dependency-audit.json
      - name: Static findings for review (not a security pass/fail verdict)
        if: always()
        run: |
          mkdir -p security-results
          .audit/bin/bandit -r app.py core.py audio.py audio_ui.py pi_audio.py components.py component_ui.py maintenance_ui.py updates.py volume.py pi_policy.py setup_ui.py setup_plan.py provision.py platform_support.py i18n.py profiles.py profile_ui.py music_ui.py network_ui.py ui_style.py pi_music.py pi_upnp.py pi_helper.py pi tools/virtual packaging_support.py build_appimage.py build_macos.py build_windows.py -f json -o security-results/bandit.json --exit-zero
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-results
          path: security-results/
          retention-days: 14
