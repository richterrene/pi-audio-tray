name: Build AppImage
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools libegl1 libopengl0
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python build_appimage.py
      - uses: actions/upload-artifact@v4
        with:
          name: PiAudioTray-x86_64
          path: dist/*
          retention-days: 14
